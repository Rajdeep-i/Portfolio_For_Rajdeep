<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Professional Projects</title>

<style>
body {
  background:#0d0d0d;
  color:#fff;
  font-family:Arial;
  padding:40px;
}

h1 {
  color:#00eaff;
  margin-bottom:30px;
}

.grid {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

.card {
  background:#121212;
  padding:18px;
  border-radius:14px;
  box-shadow:0 0 20px rgba(0,234,255,.15);
  cursor:pointer;
  transition:.3s;
}

.card:hover {
  transform:translateY(-8px);
}

.card img {
  width:100%;
  border-radius:10px;
}

.card h3 {
  color:#00eaff;
  margin:12px 0 6px;
}
</style>
</head>

<body>

<h1>Professional Studio Projects</h1>

<div class="grid">

  <div class="card" onclick="openProject('unreal-system')">
    <img src="/IMG/Profesonal1.jpg">
    <h3>Unreal Blueprint System</h3>
    <p>Studio gameplay & interaction systems</p>
  </div>

  <div class="card" onclick="openProject('ui-framework')">
    <img src="/IMG/Profesonal2.jpg">
    <h3>UI Framework</h3>
    <p>Menu & HUD architecture</p>
  </div>

</div>

<script>
function openProject(id){
  window.open(`project-detail.html?id=${id}`, '_blank');
}
</script>

</body>
</html>
